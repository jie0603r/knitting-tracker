<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>編織記錄器 Knitting Tracker</title>
  
  <!-- PWA 相關設定 -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#e67e22">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="編織記錄器">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3050/3050158.png">

  <link rel="stylesheet" href="style.css">
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="config.js"></script>
</head>
<body>

  <!-- 手機版浮動頂部列 -->
  <div class="mobile-header">
    <button id="mobile-menu-btn" class="btn-mobile-menu">☰ 作品選單</button>
    <span class="mobile-app-title">🧶 編織記錄器</span>
  </div>

  <!-- 手機版側邊欄背景遮罩 -->
  <div id="sidebar-overlay" class="sidebar-overlay"></div>

  <div class="app-container">
    <!-- 側邊欄 -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <h2>📂 作品清單</h2>
        <button id="toggle-sidebar-btn" class="btn-toggle-sidebar" title="收起選單">◀</button>
      </div>
      <button id="add-project-btn" class="btn-primary">+ 新增作品</button>
      <ul id="project-list" class="project-list"></ul>
    </aside>

    <!-- 主內容區 -->
    <main class="main-content">
      <header class="header">
        <button id="desktop-menu-btn" class="btn-desktop-menu" title="展開選單">📂 選單</button>
        <h1 id="current-project-title">載入中...</h1>
      </header>

      <!-- 新增區塊表單 -->
      <section class="card input-card">
        <div class="create-type-switch">
          <button id="btn-type-knitting" class="type-btn active" onclick="switchCreateType('knitting')">🧶 編織區塊</button>
          <button id="btn-type-check" class="type-btn" onclick="switchCreateType('check')">🔍 針數檢查區塊</button>
        </div>

        <div class="input-group">
          <input type="text" id="section-name" placeholder="請輸入區塊名稱（如：左袖口）">
        </div>

        <div class="input-group row-input-group">
          <label id="total-input-label" for="total-rows">目標總數：</label>
          <input type="number" id="total-rows" min="1" placeholder="例如：23">
          <button id="unit-toggle-btn" class="btn-unit-toggle" onclick="toggleUnit()">行</button>
        </div>

        <button id="add-btn" class="btn-primary">建立編織區塊</button>
      </section>

      <!-- 計數卡片清單區 -->
      <section id="counter-list" class="counter-list"></section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
