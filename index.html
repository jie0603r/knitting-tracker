<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧶 毛線編織計數器</title>
  
  <!-- PWA 設定 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#e67e22">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    
    <!-- 👈 左側邊欄：作品目錄區 -->
    <aside class="sidebar">
      <header class="sidebar-header">
        <h1>🧶 編織計數器</h1>
        <p class="subtitle">追蹤作品與每一個區塊</p>
        <button id="add-project-btn" class="btn-add-project-sidebar">+ 新增作品</button>
      </header>

      <div class="project-tree-container">
        <div class="tree-title">📂 選擇作品</div>
        <ul id="project-list" class="project-tree">
          <!-- 由 JS 動態生成作品階層清單 -->
        </ul>
      </div>
    </aside>

    <!-- 👉 右側主要內容區：區塊建立與卡片列表 -->
    <main class="main-content">
      <div class="main-header">
        <h2 id="current-project-title">載入中...</h2>
      </div>

      <!-- 新增區塊表單 (支援微型單位切換與模式切換) -->
      <section class="input-section">
        <div class="input-type-toggle">
          <button id="btn-type-knitting" class="btn-type-tab active" onclick="switchCreateType('knitting')">🧶 新增編織區塊</button>
          <button id="btn-type-check" class="btn-type-tab" onclick="switchCreateType('check')">🔍 新增針數檢查</button>
        </div>

        <div class="form-group">
          <label for="section-name">區塊名稱：</label>
          <input type="text" id="section-name" placeholder="例如：肩膀、袖口針數確認" autocomplete="off">
        </div>
        
        <div class="form-group">
          <label id="total-input-label" for="total-rows">目標總數：</label>
          <div class="input-unit-wrapper">
            <input type="number" id="total-rows" placeholder="例如：23" min="1">
            <button type="button" id="unit-toggle-btn" class="btn-unit-toggle" onclick="toggleUnit()">行</button>
          </div>
        </div>

        <button id="add-btn" class="btn-primary">建立編織區塊</button>
      </section>

      <!-- 計數卡片展示區塊 -->
      <section class="counter-display-area">
        <div id="counter-list" class="counter-list">
          <!-- 動態卡片將透過 JavaScript 渲染於此 -->
        </div>
      </section>
    </main>

  </div>

  <!-- Firebase 雲端 SDK 連結 -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <!-- 專案邏輯腳本 -->
  <script src="config.js"></script>
  <script src="script.js"></script>

</body>
</html>
